appId: com.mrcatz.dbcatz
productName: DBCatz
copyright: Copyright © 2026 Mahryan Rakhmatullah
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# the licences of the open-source packages inside (Catzoid #66), opened from About → Third-party licences
extraResources:
  - from: resources/third-party-licenses.txt
    to: third-party-licenses.txt
  # the AppImage's install window and menu entry (Linux, appimage.ts)
  - from: resources/icon.png
    to: icon.png
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarized by scripts/package.mjs (bun run package) when the notarytool keychain
  # profile mrcatz-notary exists; the app is notarized + stapled here, the DMG after.
  notarize: true
  minimumSystemVersion: '13.0'
# dbcatz://open?conn=… links (from DevCatz and anywhere else).
protocols:
  - name: DBCatz
    schemes: [dbcatz]
dmg:
  # Signed too, then notarized and stapled by scripts/package.mjs (Apple's recommended order).
  sign: true
  title: DBCatz ${version}
  artifactName: DBCatz-${version}-${arch}.${ext}
  # Drawn from scripts/dmg/background.svg (1× and @2x PNG; electron-builder joins them into a Retina TIFF).
  background: resources/dmg/background.png
  iconSize: 112
  iconTextSize: 13
  contents:
    - { x: 150, y: 190, type: file }
    - { x: 450, y: 190, type: link, path: /Applications }
  window: { width: 600, height: 400 }
# Releases on GitHub: DevCatz's "Download & Install" reads the latest one.
publish:
  provider: github
  owner: catzoidhub
  repo: DBCatz
win:
  icon: resources/icon.png # ≥ 256 × 256; electron-builder makes the .ico
  target:
    - target: nsis
      arch: [x64]
  # Sets the .exe's icon and version info; with no certificate configured nothing is signed here.
  signAndEditExecutable: true
nsis:
  oneClick: false
  # Per user: no administrator prompt, and in-app updates work without UAC.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # What the Catzoid site's catalog matches (catalog.go winX64).
  artifactName: ${productName}-Setup-${version}.${ext}
  # The DBCatz look (drawn from scripts/installer/*.svg) and the Welcome / Shortcuts pages (resources/installer/installer.nsh).
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  include: resources/installer/installer.nsh
  shortcutName: DBCatz
  # Asked on the Shortcuts page instead (installer.nsh); the Start menu entry is always made.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  uninstallDisplayName: ${productName}
linux:
  icon: resources/icon.png
  category: Development
  maintainer: Mahryan Rakhmatullah <109191921+ryankucingg@users.noreply.github.com>
  executableName: dbcatz
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: A database client for MySQL, PostgreSQL, SQLite, Redis, MongoDB and more
  description: DBCatz — a database client with a tab per connection for MySQL, MariaDB, PostgreSQL, SQLite, Redis, Valkey, MongoDB and Elasticsearch; local, over SSH, AWS IAM or Vault.
  desktop:
    entry:
      Name: DBCatz
      GenericName: Database client
      Comment: MySQL, PostgreSQL, SQLite, Redis, MongoDB and more in one window
      Keywords: database;sql;mysql;postgresql;sqlite;redis;mongodb;
  # The window belongs to this menu entry (app_id / WM_CLASS = dbcatz.desktop's name).
  syncDesktopName: true
deb:
  # App Center / GNOME Software read this when the .deb is opened: summary, description, screenshots, brand colours.
  fpm:
    - resources/linux/com.mrcatz.dbcatz.metainfo.xml=/usr/share/metainfo/com.mrcatz.dbcatz.metainfo.xml
  # Without them the app does not start on a fresh Ubuntu (libgbm.so.1); the rest as electron-builder's defaults.
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, libasound2t64 | libasound2]

# No native modules to compile: ssh2's optional cpu-features / crypto bindings fall back to pure JS.
npmRebuild: false
# The static AppImage runtime: Ubuntu 24.04 has no libfuse2, and the older runtime fails there.
toolsets:
  appimage: 1.0.3
